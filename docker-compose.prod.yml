# ─────────────────────────────────────────────────────────────────────────────
# Развёртывание: сайт, мини-апп и бот на одном сервере.
#
# Отличается от docker-compose.yml, который лежит рядом: тот поднимает только
# базу для разработки на localhost:5433. Здесь — всё сразу, с HTTPS и без
# публикации базы наружу.
#
# Запуск:
#   cp .env.example .env      # и заполнить
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Все секреты приходят переменными окружения: файла appsettings.Local.json
# в развёртывании нет, и в образ он не попадает (см. .dockerignore).
# ─────────────────────────────────────────────────────────────────────────────

name: english-trainer

# Общие настройки обоих процессов. Якорь, а не три копии одного списка:
# разошедшиеся настройки у API и бота дают худший вид поломки — «сайт
# работает, а мини-апп не пускает».
x-app-environment: &app-environment
  # Production, а не Development: автоприменение миграций и загрузка словаря
  # при старте выключены, схему обновляет отдельный шаг.
  ASPNETCORE_ENVIRONMENT: Production

  # Строка подключения записана одной строкой намеренно: перенос внутри неё
  # YAML превратил бы в пробел, а пробел в connection string — это лишний
  # повод для загадочной ошибки «host not found» при разборе параметров.
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-english_trainer};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}"

  # Секрет подписи токенов. Приложение не стартует с пустым или коротким —
  # это защита от развёртывания, где токены может подделать любой.
  Jwt__Secret: ${JWT_SECRET:?задайте JWT_SECRET в .env}

  Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:?задайте TELEGRAM_BOT_TOKEN в .env}
  Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME:-}
  # Публичный адрес мини-аппа. Обязателен HTTPS: по HTTP Telegram кнопку
  # WebApp не открывает.
  Telegram__WebAppUrl: ${PUBLIC_URL:?задайте PUBLIC_URL в .env}

  # Приложение стоит за Caddy, поэтому доверяет его заголовкам X-Forwarded-*.
  # Без этого ссылка для сброса пароля указывала бы на внутренний адрес.
  ReverseProxy__Enabled: "true"

  # Почта для ссылки сброса пароля. Пустой Email__Smtp__Host — рабочий режим:
  # письмо выводится в журнал контейнера, а форма «забыли пароль» об этом
  # предупреждает. Публичный адрес задаётся явно: внутренний адрес контейнера
  # в письме бесполезен, а за прокси внешний по запросу определяется не всегда.
  #
  # Provider=brevo — отправка через HTTP API: нужна там, где хостинг закрывает
  # исходящие почтовые порты (25/465/587), а это обычная антиспам-мера VPS.
  Email__Provider: ${EMAIL_PROVIDER:-smtp}
  Email__Smtp__Host: ${EMAIL_SMTP_HOST:-}
  Email__Smtp__Port: ${EMAIL_SMTP_PORT:-587}
  Email__Smtp__User: ${EMAIL_SMTP_USER:-}
  Email__Smtp__Password: ${EMAIL_SMTP_PASSWORD:-}
  Email__Smtp__EnableSsl: ${EMAIL_SMTP_SSL:-true}
  Email__Brevo__ApiKey: ${EMAIL_BREVO_API_KEY:-}
  Email__TimeoutSeconds: ${EMAIL_TIMEOUT_SECONDS:-20}
  Email__From: ${EMAIL_FROM:-}
  Email__FromName: ${EMAIL_FROM_NAME:-EnglishTrainer}
  Email__PublicUrl: ${PUBLIC_URL:?задайте PUBLIC_URL в .env}

  # Видимость в поиске. Адрес сайта берётся из того же PUBLIC_URL, что и письма:
  # второй переменной для того же значения не нужно — они разошлись бы.
  #
  # Номер счётчика и имена файлов подтверждения выдаются панелями Вебмастера
  # и Search Console. Пустые значения — рабочий режим: счётчик не подключается,
  # страницы подтверждения не отдаются.
  Seo__PublicBaseUrl: ${PUBLIC_URL:?задайте PUBLIC_URL в .env}

  # Номер счётчика — не секрет: он всё равно виден в исходниках страницы.
  # Поэтому у него есть значение по умолчанию прямо здесь, а не только в .env.
  # Причина практическая: deploy.ps1 при обновлении забирает .env с сервера,
  # и ключ, добавленный только локально, однажды молча пропал бы — счётчик
  # перестал бы собирать данные, а заметить это можно через неделю по пустым
  # отчётам. Другой счётчик (например, тестовый) задаётся SEO_METRIKA_ID в .env.
  Seo__YandexMetrikaId: ${SEO_METRIKA_ID:-113772679}
  Seo__MetrikaWebvisor: ${SEO_METRIKA_WEBVISOR:-false}

  # Имя файла подтверждения. Значение по умолчанию — файл, выданный для
  # englishrainer.site: имя не секрет, а пустая переменная в .env молча
  # отключила бы подтверждение прав. Другой домен — другое имя, задаётся здесь.
  Seo__YandexVerificationFile: ${SEO_YANDEX_VERIFICATION_FILE:-yandex_40975086de533cb4.html}
  Seo__GoogleVerificationFile: ${SEO_GOOGLE_VERIFICATION_FILE:-}

  # Реклама РСЯ. Выключена, пока сайт не одобрен; после одобрения блок
  # включается переменными, без пересборки образа: Ads__Enabled=true
  # и Ads__BlockId=R-A-…  Идентификатор блока не секрет.
  Ads__Enabled: ${ADS_ENABLED:-false}
  Ads__BlockId: ${ADS_BLOCK_ID:-}

  # Реквизиты оператора для политики обработки данных. Пустое имя оставит
  # нейтральную формулировку «администратор сайта EnglishTrainer».
  Legal__OperatorName: ${LEGAL_OPERATOR_NAME:-}
  Legal__OperatorInn: ${LEGAL_OPERATOR_INN:-}
  Legal__ContactEmail: ${LEGAL_CONTACT_EMAIL:-passwordenglishtrainer@mail.ru}

services:
  # ── База данных ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: english-trainer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-english_trainer}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-english_trainer}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт публикуется ТОЛЬКО на петлевой интерфейс сервера — 127.0.0.1.
    #
    # Снаружи база недоступна: подключиться можно лишь с самого сервера или
    # через SSH-туннель. Так сделано потому, что открытый в интернет
    # PostgreSQL начинают перебирать пароли в первые же минуты, и эти попытки
    # не прекращаются никогда — они лишь засоряют журнал и жгут процессор.
    #
    # DBeaver умеет это сам: вкладка SSH в настройках подключения открывает
    # туннель, после чего «localhost:5432» на вкладке Main означает адрес
    # с точки зрения сервера.
    ports:
      - "127.0.0.1:5432:5432"

  # ── Схема и словарь ────────────────────────────────────────────────────────
  # Одноразовый шаг, который выполняется до запуска приложения. Отдельным
  # сервисом, а не «при старте»: при нескольких экземплярах одновременное
  # применение миграций — это гонка, а не ускорение.
  migrate:
    build:
      context: .
      target: api
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-environment
    command:
      - sh
      - -c
      - |
        dotnet EnglishTrainer.Api.dll migrate &&
        dotnet EnglishTrainer.Api.dll seed

  # ── Сайт и мини-апп ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: api
    container_name: english-trainer-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *app-environment
    volumes:
      # Аватары — единственные пользовательские файлы приложения. Без тома
      # они исчезали бы при каждом обновлении образа.
      - avatars:/app/wwwroot/avatars
    expose:
      - "8080"

  # ── Бот ────────────────────────────────────────────────────────────────────
  bot:
    build:
      context: .
      target: bot
    container_name: english-trainer-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *app-environment
    # Входящие соединения боту не нужны: он сам опрашивает Telegram.

  # ── HTTPS ──────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: english-trainer-proxy
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Домен, на который выдан сертификат. Сертификат Caddy получает сам.
      SITE_ADDRESS: ${PUBLIC_URL:?задайте PUBLIC_URL в .env}
    ports:
      # 80-й занят всегда: через него Let's Encrypt подтверждает владение
      # доменом (HTTP-01). Проверка идёт через 80-й, а не через TLS-ALPN на
      # 443-м: так сертификат выдаётся независимо от того, кто ещё слушает
      # 443 (например, панель управления или другой TLS-сервис).
      - "80:80"

      # Порт HTTPS настраивается. Если 443 свободен — оставьте по умолчанию;
      # если его занимает другая служба, укажите другой порт в .env
      # (HTTPS_PORT=9443) — адрес станет https://домен:9443.
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  avatars:
  # Сертификаты и ключи Let's Encrypt. Без тома Caddy запрашивал бы новый
  # сертификат после каждого пересоздания контейнера, а у Let's Encrypt
  # на это есть недельный лимит.
  caddy-data:
  caddy-config:
